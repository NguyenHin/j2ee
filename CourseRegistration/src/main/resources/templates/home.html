<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- HEADER -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">Course Registration</a>

            <form class="d-flex" action="/search" method="get">
                <input 
                    class="form-control me-2"
                    type="search"
                    name="keyword"
                    placeholder="Search course"
                >
                <button class="btn btn-outline-light" type="submit">
                    Search
                </button>
            </form>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container mt-4">
        <h3 class="mb-4">Course List</h3>

        <div class="row">
            <div 
                class="col-md-4 mb-4"
                th:each="course : ${courses.content}"
            >
                <div class="card shadow h-100">
                    <img 
                        th:src="${course.image}"
                        class="card-img-top"
                        style="height: 200px; object-fit: cover;"
                    >

                    <div class="card-body">
                        <h5 
                            class="card-title"
                            th:text="${course.name}">
                        </h5>

                        <p class="card-text">
                            <strong>Tín chỉ:</strong>
                            <span th:text="${course.credits}"></span>
                        </p>

                        <p class="card-text">
                            <strong>Giảng viên:</strong>
                            <span th:text="${course.lecturer}"></span>
                        </p>

                        <a 
                            th:href="@{/enroll/{id}(id=${course.id})}"
                            class="btn btn-success"
                        >
                            Enroll
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGINATION -->
        <nav>
            <ul class="pagination justify-content-center">
                <li 
                    class="page-item"
                    th:classappend="${courses.first}? 'disabled'"
                >
                    <a 
                        class="page-link"
                        th:href="@{/home(page=${courses.number-1})}"
                    >
                        Previous
                    </a>
                </li>

                <li 
                    class="page-item"
                    th:each="i : ${#numbers.sequence(0, courses.totalPages - 1)}"
                    th:classappend="${i == courses.number}? 'active'"
                >
                    <a 
                        class="page-link"
                        th:href="@{/home(page=${i})}"
                        th:text="${i + 1}">
                    </a>
                </li>

                <li 
                    class="page-item"
                    th:classappend="${courses.last}? 'disabled'"
                >
                    <a 
                        class="page-link"
                        th:href="@{/home(page=${courses.number + 1})}"
                    >
                        Next
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Bài 5 - QLSP JPA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">


        <!-- Menu -->
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/products}">Danh sách</a>
            <a class="nav-link" th:href="@{/cart}">Giỏ hàng</a>
        </div>

        <!-- SEARCH -->
        <form class="d-flex"
              th:action="@{/products}"
              method="get">

            <input class="form-control me-2"
                   type="search"
                   name="keyword"
                   placeholder="Tìm sản phẩm..."
                   th:value="${keyword}">

            <button class="btn btn-outline-light"
                    type="submit">
                Search
            </button>

        </form>

    </div>
</nav>


<div class="container mt-4" layout:fragment="content">
</div>


<div class="card-footer text-center mt-5">
    <p>&copy; 2025 - Phát triển ứng dụng với J2EE</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>

<div layout:fragment="content" class="container mt-4">

    <h2 class="mb-4 text-center">🛒 Giỏ hàng của bạn</h2>

    <table class="table table-bordered table-hover align-middle text-center">

        <thead class="table-dark">
        <tr>
            <th style="width:20%">Tên sản phẩm</th>
            <th style="width:15%">Hình ảnh</th>
            <th style="width:15%">Giá</th>
            <th style="width:20%">Số lượng</th>
            <th style="width:15%">Thành tiền</th>
            <th style="width:15%">Hành động</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="item : ${cartItems}">

            <!-- NAME -->
            <td class="fw-semibold" th:text="${item.name}"></td>

            <!-- IMAGE -->
            <td>
                <img th:src="@{'/images/' + ${item.image}}"
                     width="80"
                     class="img-thumbnail">
            </td>

            <!-- PRICE -->
            <td class="text-danger fw-bold"
                th:text="${#numbers.formatDecimal(item.price,0,0)} + ' VND'">
            </td>

            <!-- QUANTITY -->
            <td>

<form th:action="@{/cart/update}" method="post"
      class="d-flex justify-content-center align-items-center gap-1">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <input type="hidden"
           name="productId"
           th:value="${item.id}" />

    <!-- Nút giảm -->
    <button type="button"
            class="btn btn-outline-secondary btn-sm"
            onclick="changeQty(this,-1)">
        -
    </button>

    <!-- Quantity -->
    <input type="number"
           name="quantity"
           th:value="${item.quantity}"
           min="1"
           class="form-control text-center"
           style="width:60px"
           onchange="this.form.submit()">

    <!-- Nút tăng -->
    <button type="button"
            class="btn btn-outline-secondary btn-sm"
            onclick="changeQty(this,1)">
        +
    </button>

</form>

</td>

            <!-- SUBTOTAL -->
            <td class="fw-bold text-success"
                th:text="${#numbers.formatDecimal(item.price * item.quantity,0,0)} + ' VND'">
            </td>

            <!-- REMOVE -->
            <td>

                <a th:href="@{/cart/remove/{id}(id=${item.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc muốn xóa?')">
                    Xóa
                </a>

            </td>

        </tr>

        <!-- TOTAL -->
        <tr class="table-light">

            <td colspan="4" class="text-end fw-bold">
                Tổng tiền:
            </td>

            <td colspan="2" class="fw-bold text-danger fs-5"
                th:text="${#numbers.formatDecimal(total,0,0)} + ' VND'">
            </td>

        </tr>

        </tbody>

    </table>

    <!-- BUTTONS -->
    <div class="d-flex justify-content-between">

        <a th:href="@{/products}" class="btn btn-secondary">
            ← Tiếp tục mua hàng
        </a>

        <form th:action="@{/cart/order}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button class="btn btn-success">
                Đặt hàng
            </button>

        </form>

    </div>

</div>

</body>
</html>
<script>

function changeQty(button, change){

    const form = button.closest("form");

    const input = form.querySelector("input[name='quantity']");

    let value = parseInt(input.value);

    value = value + change;

    if(value < 1){
        value = 1;
    }

    input.value = value;

    form.submit();
}

</script>
